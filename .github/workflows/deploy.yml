name: Deploy to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/222674024026/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@emt-real-time-2026.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy emt-real-time-api \
            --image=europe-southwest1-docker.pkg.dev/emt-real-time-2026/emt-real-time/emt-real-time-api:${{ github.sha }} \
            --region=europe-southwest1 \
            --platform=managed